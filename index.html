<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>合租房租分摊计算器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* INS风格渐变 */
    .ins-gradient {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    }
    .ins-gradient-soft {
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
    }
    .ins-gradient-card {
      background: linear-gradient(145deg, rgba(255,255,255,0.95) 0%, rgba(255,255,255,0.85) 100%);
    }
    .ins-gradient-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .ins-gradient-result {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 50%, #667eea 100%);
    }

    /* 柔和阴影 */
    .soft-shadow {
      box-shadow: 0 4px 20px rgba(102, 126, 234, 0.15);
    }
    .soft-shadow-lg {
      box-shadow: 0 8px 30px rgba(102, 126, 234, 0.2);
    }

    /* 动画 */
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .animate-slide-up {
      animation: slideUp 0.4s ease-out;
    }
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out;
    }
    .animate-scale-in {
      animation: scaleIn 0.3s ease-out;
    }
    .custom-item {
      animation: slideInRight 0.3s ease-out;
    }

    /* 弹窗遮罩 */
    .modal-overlay {
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
    }

    /* 输入框聚焦 */
    .input-focus:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
    }

    /* 滚动条 */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

    /* PC端限制 */
    @media (min-width: 768px) {
      body {
        max-width: 420px;
        margin: 0 auto;
        min-height: 100vh;
        box-shadow: 0 0 40px rgba(102, 126, 234, 0.15);
      }
    }

    /* 隐藏number箭头 */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    /* OCR加载动画 */
    @keyframes ocrSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .ocr-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: ocrSpin 1s linear infinite;
    }

    /* OCR结果弹窗项目 */
    .ocr-result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      border-radius: 12px;
      margin-bottom: 8px;
    }
    .ocr-result-item:last-child {
      margin-bottom: 0;
    }
  </style>
  <!-- Tesseract.js OCR引擎 -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="min-h-screen bg-gray-50">
  <div class="min-h-screen bg-gradient-to-br from-purple-50 via-pink-50 to-blue-50">

    <!-- 顶部标题栏 -->
    <header class="ins-gradient px-4 pt-8 pb-5 relative overflow-hidden">
      <!-- 装饰圆 -->
      <div class="absolute -top-10 -right-10 w-24 h-24 bg-white/10 rounded-full"></div>
      <div class="absolute -bottom-5 -left-5 w-16 h-16 bg-white/10 rounded-full"></div>

      <div class="relative flex items-center justify-between">
        <div>
          <h1 class="text-lg font-bold text-white tracking-wide">房租分摊计算器</h1>
          <p class="text-white/70 text-xs mt-0.5">轻松计算，合理分摊</p>
        </div>
        <!-- 历史记录入口 -->
        <button onclick="openHistoryModal()"
          class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-sm flex items-center justify-center text-white hover:bg-white/30 active:scale-90 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- 主内容区 -->
    <main class="px-4 pb-8 space-y-3">

      <!-- 基础固定费用 -->
      <section class="ins-gradient-card rounded-2xl p-4 soft-shadow animate-slide-up">
        <h2 class="text-sm font-semibold text-gray-700 mb-3 flex items-center justify-between">
          <span class="flex items-center">
            <span class="w-6 h-6 rounded-lg bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center mr-2 text-white text-xs">🏠</span>
            基础固定费用
          </span>
          <!-- 账单识别按钮 -->
          <button onclick="document.getElementById('ocrInput').click()"
            class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gradient-to-r from-blue-500 to-cyan-500 text-xs font-medium text-white soft-shadow active:scale-95 transition-transform">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            账单识别
          </button>
          <input type="file" id="ocrInput" accept="image/*" class="hidden" onchange="handleOCRImage(event)">
        </h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-gray-400 mb-1.5 block">月度房租</label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">¥</span>
              <input type="text" id="rent" placeholder="0.00"
                class="input-focus w-full bg-gray-50 border border-gray-200 rounded-xl pl-7 pr-3 py-3 text-gray-800 placeholder-gray-300 focus:outline-none transition-all"
                oninput="validateNumber(this); calculate()">
            </div>
          </div>
          <div>
            <label class="text-xs text-gray-400 mb-1.5 block">物业管理费</label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">¥</span>
              <input type="text" id="managementFee" placeholder="0.00"
                class="input-focus w-full bg-gray-50 border border-gray-200 rounded-xl pl-7 pr-3 py-3 text-gray-800 placeholder-gray-300 focus:outline-none transition-all"
                oninput="validateNumber(this); calculate()">
            </div>
          </div>
        </div>
      </section>

      <!-- 水电杂费 -->
      <section class="ins-gradient-card rounded-2xl p-4 soft-shadow animate-slide-up" style="animation-delay: 0.05s">
        <h2 class="text-sm font-semibold text-gray-700 mb-3 flex items-center">
          <span class="w-6 h-6 rounded-lg bg-gradient-to-br from-blue-500 to-cyan-400 flex items-center justify-center mr-2 text-white text-xs">💧</span>
          水电杂费
        </h2>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs text-gray-400 mb-1.5 block">水费</label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">¥</span>
              <input type="text" id="waterFee" placeholder="0.00"
                class="input-focus w-full bg-gray-50 border border-gray-200 rounded-xl pl-7 pr-3 py-3 text-gray-800 placeholder-gray-300 focus:outline-none transition-all"
                oninput="validateNumber(this); calculate()">
            </div>
          </div>
          <div>
            <label class="text-xs text-gray-400 mb-1.5 block">电费</label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm">¥</span>
              <input type="text" id="electricFee" placeholder="0.00"
                class="input-focus w-full bg-gray-50 border border-gray-200 rounded-xl pl-7 pr-3 py-3 text-gray-800 placeholder-gray-300 focus:outline-none transition-all"
                oninput="validateNumber(this); calculate()">
            </div>
          </div>
        </div>
      </section>

      <!-- 分摊人数 -->
      <section class="ins-gradient-card rounded-2xl p-4 soft-shadow animate-slide-up" style="animation-delay: 0.1s">
        <h2 class="text-sm font-semibold text-gray-700 mb-3 flex items-center">
          <span class="w-6 h-6 rounded-lg bg-gradient-to-br from-pink-500 to-rose-400 flex items-center justify-center mr-2 text-white text-xs">👥</span>
          分摊设置
        </h2>
        <div>
          <label class="text-xs text-gray-400 mb-1.5 block">平摊人数</label>
          <div class="flex items-center gap-3">
            <button onclick="changePeople(-1)"
              class="w-11 h-11 rounded-xl bg-gray-100 text-gray-600 text-xl font-light hover:bg-gray-200 active:scale-95 transition-all">−</button>
            <input type="number" id="peopleCount" value="1" min="1"
              class="input-focus flex-1 text-center bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-xl font-semibold text-gray-800 focus:outline-none transition-all"
              oninput="validateInteger(this); calculate()">
            <button onclick="changePeople(1)"
              class="w-11 h-11 rounded-xl bg-gray-100 text-gray-600 text-xl font-light hover:bg-gray-200 active:scale-95 transition-all">+</button>
          </div>
        </div>
      </section>

      <!-- 自定义消费 -->
      <section class="ins-gradient-card rounded-2xl p-4 soft-shadow animate-slide-up" style="animation-delay: 0.15s">
        <h2 class="text-sm font-semibold text-gray-700 mb-3 flex items-center justify-between">
          <span class="flex items-center">
            <span class="w-6 h-6 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center mr-2 text-white text-xs">➕</span>
            自定义消费
          </span>
          <button onclick="addCustomItem()"
            class="px-3 py-1.5 rounded-lg ins-gradient-btn text-xs font-medium text-white soft-shadow active:scale-95 transition-transform">
            + 添加
          </button>
        </h2>
        <div id="customItemsContainer" class="space-y-2.5"></div>
        <p id="noCustomTip" class="text-center text-xs text-gray-400 py-3">点击「添加」创建消费类目</p>
      </section>

      <!-- 计算结果 -->
      <section class="ins-gradient-result rounded-2xl p-4 soft-shadow-lg animate-slide-up" style="animation-delay: 0.2s">
        <div class="grid grid-cols-2 gap-4">
          <div class="text-center">
            <p class="text-white/70 text-xs mb-1">总费用</p>
            <p id="totalAmount" class="text-2xl font-bold text-white">¥0.00</p>
          </div>
          <div class="text-center border-l border-white/20">
            <p class="text-white/70 text-xs mb-1">人均应付</p>
            <p id="perPersonAmount" class="text-2xl font-bold text-yellow-300">¥0.00</p>
          </div>
        </div>
      </section>

      <!-- 操作按钮 -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="resetForm()"
          class="py-3.5 rounded-xl bg-white border border-gray-200 text-sm font-medium text-gray-600 soft-shadow hover:bg-gray-50 active:scale-95 transition-all">
          重置表单
        </button>
        <button onclick="saveBill()"
          class="py-3.5 rounded-xl ins-gradient-btn text-sm font-semibold text-white soft-shadow active:scale-95 transition-transform">
          保存账单
        </button>
      </div>
    </main>
  </div>

  <!-- 历史记录弹窗 -->
  <div id="historyModal" class="fixed inset-0 z-50 hidden">
    <div class="modal-overlay absolute inset-0" onclick="closeHistoryModal()"></div>
    <div class="absolute inset-x-4 top-20 bottom-20 max-h-[70vh] bg-white rounded-3xl soft-shadow-lg overflow-hidden animate-scale-in flex flex-col">
      <!-- 弹窗头部 -->
      <div class="ins-gradient px-5 py-4 flex items-center justify-between">
        <h3 class="text-lg font-semibold text-white">历史账单</h3>
        <button onclick="closeHistoryModal()" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-white hover:bg-white/30 active:scale-90 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <!-- 账单列表 -->
      <div id="historyContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
        <!-- 动态加载 -->
      </div>
      <p id="noHistoryTip" class="hidden text-center text-sm text-gray-400 py-10">暂无历史记录</p>
      <!-- 底部提示 -->
      <div class="px-4 py-3 bg-gray-50 border-t border-gray-100 text-center">
        <span class="text-xs text-gray-400">最多保留 5 条记录 · 点击账单可回填数据</span>
      </div>
    </div>
  </div>

  <!-- OCR识别中弹窗 -->
  <div id="ocrLoadingModal" class="fixed inset-0 z-50 hidden">
    <div class="modal-overlay absolute inset-0"></div>
    <div class="absolute inset-0 flex items-center justify-center">
      <div class="bg-gradient-to-br from-purple-600 to-pink-500 rounded-3xl p-8 soft-shadow-lg text-center animate-scale-in">
        <div class="ocr-spinner mx-auto mb-4"></div>
        <p class="text-white font-semibold text-lg mb-1">正在识别账单</p>
        <p id="ocrProgress" class="text-white/70 text-sm">准备中...</p>
      </div>
    </div>
  </div>

  <!-- OCR结果确认弹窗 -->
  <div id="ocrResultModal" class="fixed inset-0 z-50 hidden">
    <div class="modal-overlay absolute inset-0" onclick="closeOCRResultModal()"></div>
    <div class="absolute inset-x-4 top-24 max-h-[70vh] bg-white rounded-3xl soft-shadow-lg overflow-hidden animate-scale-in">
      <!-- 弹窗头部 -->
      <div class="bg-gradient-to-r from-blue-500 to-cyan-500 px-5 py-4 flex items-center justify-between">
        <h3 class="text-lg font-semibold text-white">识别结果</h3>
        <button onclick="closeOCRResultModal()" class="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center text-white hover:bg-white/30 active:scale-90 transition-all">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
      <!-- 结果内容 -->
      <div class="p-5">
        <p class="text-sm text-gray-500 mb-4">以下金额将自动填入对应输入框，请核对后确认</p>
        <div id="ocrResultList"></div>
      </div>
      <!-- 操作按钮 -->
      <div class="px-5 pb-5 flex gap-3">
        <button onclick="closeOCRResultModal()"
          class="flex-1 py-3 rounded-xl bg-gray-100 text-sm font-medium text-gray-600 active:scale-95 transition-all">
          取消
        </button>
        <button onclick="applyOCRResult()"
          class="flex-1 py-3 rounded-xl bg-gradient-to-r from-blue-500 to-cyan-500 text-sm font-semibold text-white active:scale-95 transition-transform">
          确认填入
        </button>
      </div>
    </div>
  </div>

  <!-- Toast提示 -->
  <div id="toast" class="fixed top-24 left-1/2 -translate-x-1/2 z-50 opacity-0 pointer-events-none transition-all duration-300">
    <span class="inline-block bg-gray-800 text-white text-sm px-5 py-2.5 rounded-full soft-shadow"></span>
  </div>

  <script>
    // ==================== 全局变量 ====================
    let customItemId = 0;
    const MAX_HISTORY = 5;
    let ocrResultData = {}; // 存储OCR识别结果

    // ==================== 初始化 ====================
    document.addEventListener('DOMContentLoaded', () => {
      calculate();
    });

    // ==================== 工具函数 ====================
    function validateNumber(input) {
      let value = input.value.replace(/[^\d.]/g, '');
      const parts = value.split('.');
      if (parts.length > 2) value = parts[0] + '.' + parts.slice(1).join('');
      input.value = value;
    }

    function validateInteger(input) {
      let value = parseInt(input.value) || 1;
      if (value < 1) value = 1;
      input.value = value;
    }

    function getValue(id) {
      return parseFloat(document.getElementById(id).value) || 0;
    }

    function formatMoney(amount) {
      return '¥' + amount.toFixed(2);
    }

    // ==================== 计算逻辑 ====================
    function calculate() {
      const rent = getValue('rent');
      const managementFee = getValue('managementFee');
      const waterFee = getValue('waterFee');
      const electricFee = getValue('electricFee');
      const peopleCount = parseInt(document.getElementById('peopleCount').value) || 1;

      let customTotal = 0;
      document.querySelectorAll('.custom-amount').forEach(input => {
        customTotal += parseFloat(input.value) || 0;
      });

      const total = rent + managementFee + waterFee + electricFee + customTotal;
      const perPerson = peopleCount > 0 ? total / peopleCount : total;

      document.getElementById('totalAmount').textContent = formatMoney(total);
      document.getElementById('perPersonAmount').textContent = formatMoney(perPerson);
    }

    // ==================== 分摊人数快捷按钮 ====================
    function changePeople(delta) {
      const input = document.getElementById('peopleCount');
      let value = parseInt(input.value) || 1;
      value = Math.max(1, value + delta);
      input.value = value;
      calculate();
    }

    // ==================== 自定义消费 ====================
    function addCustomItem(name = '', amount = '') {
      customItemId++;
      const container = document.getElementById('customItemsContainer');
      const noTip = document.getElementById('noCustomTip');

      const itemDiv = document.createElement('div');
      itemDiv.className = 'custom-item flex items-center gap-2';
      itemDiv.id = `customItem${customItemId}`;
      itemDiv.innerHTML = `
        <input type="text" placeholder="类目名称" value="${name}"
          class="custom-name flex-1 min-w-0 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2.5 text-sm text-gray-700 placeholder-gray-300 focus:outline-none input-focus transition-all"
          oninput="calculate()">
        <div class="relative w-24">
          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400 text-xs">¥</span>
          <input type="text" placeholder="0" value="${amount}"
            class="custom-amount w-full bg-gray-50 border border-gray-200 rounded-lg pl-5 pr-2.5 py-2.5 text-sm text-right text-gray-700 placeholder-gray-300 focus:outline-none input-focus transition-all"
            oninput="validateNumber(this); calculate()">
        </div>
        <button onclick="removeCustomItem(${customItemId})"
          class="w-9 h-9 flex items-center justify-center rounded-lg bg-red-50 text-red-400 hover:bg-red-100 active:scale-90 transition-all">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
        </button>
      `;

      container.appendChild(itemDiv);
      noTip.classList.add('hidden');
      calculate();
    }

    function removeCustomItem(id) {
      const item = document.getElementById(`customItem${id}`);
      if (item) {
        item.style.opacity = '0';
        item.style.transform = 'translateX(-10px)';
        item.style.transition = 'all 0.2s ease-out';
        setTimeout(() => {
          item.remove();
          calculate();
          const container = document.getElementById('customItemsContainer');
          const noTip = document.getElementById('noCustomTip');
          if (container.children.length === 0) {
            noTip.classList.remove('hidden');
          }
        }, 200);
      }
    }

    // ==================== 表单操作 ====================
    function resetForm() {
      document.getElementById('rent').value = '';
      document.getElementById('managementFee').value = '';
      document.getElementById('waterFee').value = '';
      document.getElementById('electricFee').value = '';
      document.getElementById('peopleCount').value = 1;
      document.getElementById('customItemsContainer').innerHTML = '';
      document.getElementById('noCustomTip').classList.remove('hidden');
      calculate();
      showToast('已重置');
    }

    function collectFormData() {
      const data = {
        rent: document.getElementById('rent').value || '',
        managementFee: document.getElementById('managementFee').value || '',
        waterFee: document.getElementById('waterFee').value || '',
        electricFee: document.getElementById('electricFee').value || '',
        peopleCount: document.getElementById('peopleCount').value || '1',
        customItems: [],
        timestamp: Date.now(),
        total: document.getElementById('totalAmount').textContent,
        perPerson: document.getElementById('perPersonAmount').textContent
      };

      document.querySelectorAll('.custom-item').forEach(item => {
        const name = item.querySelector('.custom-name').value;
        const amount = item.querySelector('.custom-amount').value;
        if (name || amount) {
          data.customItems.push({ name, amount });
        }
      });

      return data;
    }

    function fillFormData(data) {
      document.getElementById('rent').value = data.rent;
      document.getElementById('managementFee').value = data.managementFee;
      document.getElementById('waterFee').value = data.waterFee;
      document.getElementById('electricFee').value = data.electricFee;
      document.getElementById('peopleCount').value = data.peopleCount;

      document.getElementById('customItemsContainer').innerHTML = '';
      const noTip = document.getElementById('noCustomTip');

      if (data.customItems && data.customItems.length > 0) {
        noTip.classList.add('hidden');
        data.customItems.forEach(item => addCustomItem(item.name, item.amount));
      } else {
        noTip.classList.remove('hidden');
      }

      calculate();
      closeHistoryModal();
      showToast('已加载账单');
    }

    // ==================== 历史记录弹窗 ====================
    function openHistoryModal() {
      loadHistory();
      const modal = document.getElementById('historyModal');
      modal.classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    function closeHistoryModal() {
      const modal = document.getElementById('historyModal');
      modal.classList.add('hidden');
      document.body.style.overflow = '';
    }

    function loadHistory() {
      const history = JSON.parse(localStorage.getItem('rentHistory') || '[]');
      const container = document.getElementById('historyContainer');
      const noTip = document.getElementById('noHistoryTip');

      if (history.length === 0) {
        container.innerHTML = '';
        noTip.classList.remove('hidden');
        return;
      }

      noTip.classList.add('hidden');
      container.innerHTML = history.map((item, index) => {
        const date = new Date(item.timestamp);
        const dateStr = `${date.getMonth() + 1}月${date.getDate()}日 ${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;

        return `
          <div onclick="loadBillData(${index})"
            class="bg-gray-50 rounded-2xl p-4 cursor-pointer hover:bg-gray-100 active:scale-[0.98] transition-all border border-gray-100">
            <div class="flex justify-between items-center mb-3">
              <span class="text-xs text-gray-400">${dateStr}</span>
              <button onclick="event.stopPropagation(); deleteBill(${index})"
                class="text-xs text-red-400 hover:text-red-500 px-2 py-0.5 rounded-full hover:bg-red-50 transition-all">删除</button>
            </div>
            <div class="flex justify-between items-end">
              <div>
                <span class="text-xs text-gray-400">总费用</span>
                <p class="text-lg font-semibold text-gray-800">${item.total}</p>
              </div>
              <div class="text-right">
                <span class="text-xs text-gray-400">人均</span>
                <p class="text-lg font-bold text-purple-600">${item.perPerson}</p>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function loadBillData(index) {
      const history = JSON.parse(localStorage.getItem('rentHistory') || '[]');
      if (history[index]) {
        fillFormData(history[index]);
      }
    }

    function deleteBill(index) {
      let history = JSON.parse(localStorage.getItem('rentHistory') || '[]');
      history.splice(index, 1);
      localStorage.setItem('rentHistory', JSON.stringify(history));
      loadHistory();
      showToast('已删除');
    }

    // ==================== 本地存储 ====================
    function saveBill() {
      const data = collectFormData();
      let history = JSON.parse(localStorage.getItem('rentHistory') || '[]');

      history.unshift(data);
      if (history.length > MAX_HISTORY) {
        history = history.slice(0, MAX_HISTORY);
      }

      localStorage.setItem('rentHistory', JSON.stringify(history));
      showToast('保存成功');
    }

    // ==================== Toast ====================
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.querySelector('span').textContent = message;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
        toast.classList.remove('opacity-100');
      }, 1500);
    }

    // ==================== OCR 账单识别 ====================

    // 关键词匹配规则
    const OCR_KEYWORDS = {
      rent: { keywords: ['房租', '租金'], label: '月度房租' },
      managementFee: { keywords: ['管理', '物业', '管理费'], label: '物业管理费' },
      waterFee: { keywords: ['水费', '水'], label: '水费' },
      electricFee: { keywords: ['电费', '电'], label: '电费' }
    };

    // 处理图片上传
    async function handleOCRImage(event) {
      const file = event.target.files[0];
      if (!file) return;

      // 清空input，允许重复选择同一文件
      event.target.value = '';

      // 显示加载弹窗
      showOCRLoading(true);

      try {
        // 压缩图片
        const compressedImage = await compressImage(file);
        // 执行OCR识别
        const text = await performOCR(compressedImage);
        // 解析文本
        const result = parseOCRText(text);

        if (Object.keys(result).length === 0) {
          showOCRLoading(false);
          showToast('未识别到有效金额，请上传清晰账单');
          return;
        }

        // 存储结果并显示确认弹窗
        ocrResultData = result;
        showOCRLoading(false);
        showOCRResultModal(result);

      } catch (error) {
        console.error('OCR识别失败:', error);
        showOCRLoading(false);
        showToast('识别失败，请重试');
      }
    }

    // 图片压缩（移动端适配）
    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            // 限制最大尺寸
            const maxSize = 1500;
            let width = img.width;
            let height = img.height;

            if (width > maxSize || height > maxSize) {
              if (width > height) {
                height = (height / width) * maxSize;
                width = maxSize;
              } else {
                width = (width / height) * maxSize;
                height = maxSize;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // 转为blob，质量0.8
            canvas.toBlob((blob) => {
              resolve(blob);
            }, 'image/jpeg', 0.8);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // 执行OCR识别
    async function performOCR(imageBlob) {
      const progressEl = document.getElementById('ocrProgress');

      const result = await Tesseract.recognize(imageBlob, 'chi_sim+eng', {
        logger: (m) => {
          if (m.status === 'recognizing text') {
            const percent = Math.round(m.progress * 100);
            progressEl.textContent = `识别中 ${percent}%`;
          } else if (m.status === 'loading language traineddata') {
            progressEl.textContent = '加载语言包...';
          }
        }
      });

      return result.data.text;
    }

    // 解析OCR文本，匹配关键词提取金额
    function parseOCRText(text) {
      const result = {};
      // 统一换行符
      const lines = text.split(/[\n\r]+/).map(line => line.trim()).filter(Boolean);

      // 遍历每个费用类别
      for (const [field, config] of Object.entries(OCR_KEYWORDS)) {
        const amounts = [];

        for (const line of lines) {
          // 检查是否包含关键词
          const hasKeyword = config.keywords.some(kw => line.includes(kw));
          if (!hasKeyword) continue;

          // 提取行内所有数字（支持小数）
          const numbers = line.match(/\d+\.?\d*/g);
          if (numbers) {
            numbers.forEach(num => {
              const val = parseFloat(num);
              // 过滤明显无效的数字（如年份、过小的数值）
              if (val > 0 && val < 100000) {
                amounts.push(val);
              }
            });
          }
        }

        // 取最大有效金额
        if (amounts.length > 0) {
          result[field] = Math.max(...amounts);
        }
      }

      return result;
    }

    // 显示/隐藏OCR加载弹窗
    function showOCRLoading(show) {
      const modal = document.getElementById('ocrLoadingModal');
      if (show) {
        document.getElementById('ocrProgress').textContent = '准备中...';
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      } else {
        modal.classList.add('hidden');
        document.body.style.overflow = '';
      }
    }

    // 显示OCR结果确认弹窗
    function showOCRResultModal(result) {
      const container = document.getElementById('ocrResultList');
      container.innerHTML = Object.entries(result).map(([field, amount]) => {
        const config = OCR_KEYWORDS[field];
        return `
          <div class="ocr-result-item">
            <span class="text-gray-600 font-medium">${config.label}</span>
            <span class="text-lg font-bold text-purple-600">¥${amount.toFixed(2)}</span>
          </div>
        `;
      }).join('');

      document.getElementById('ocrResultModal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }

    // 关闭OCR结果弹窗
    function closeOCRResultModal() {
      document.getElementById('ocrResultModal').classList.add('hidden');
      document.body.style.overflow = '';
      ocrResultData = {};
    }

    // 应用OCR识别结果
    function applyOCRResult() {
      for (const [field, amount] of Object.entries(ocrResultData)) {
        const input = document.getElementById(field);
        if (input) {
          input.value = amount.toFixed(2);
        }
      }
      closeOCRResultModal();
      calculate();
      showToast('已填入识别金额');
    }
  </script>
</body>
